[package]
name = "minamo-desktop"
version = "0.1.23"
description = "Minamo Studio desktop shell"
edition = "2021"
license = "0BSD"

[lib]
name = "minamo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = { version = "2.10.1", default-features = false, features = ["rustls-tls"] }

[patch.crates-io]
# GTK3 requires this release line; retain the reviewed upstream soundness fix.
glib = { path = "vendor/glib-0.18.5-patched" }
