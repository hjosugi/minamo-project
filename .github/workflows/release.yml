name: release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release/v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to publish without moving it
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      release_id: ${{ steps.release.outputs.id }}
      tag: ${{ steps.release_tag.outputs.tag }}
    steps:
      - name: Resolve immutable release tag
        id: release_tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if test -n "$INPUT_TAG"; then
            tag="$INPUT_TAG"
          elif test "$REF_TYPE" = tag; then
            tag="$REF_NAME"
          else
            case "$REF_NAME" in
              release/v*) tag="${REF_NAME#release/}" ;;
              *) echo "unsupported release ref: $REF_NAME" >&2; exit 1 ;;
            esac
          fi
          case "$tag" in
            v*) ;;
            *) echo "release tag must start with v: $tag" >&2; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.release_tag.outputs.tag }}

      - name: Validate release metadata
        env:
          TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          tauri_version="$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json', 'utf8')).version")"
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)"
          test "$TAG" = "v$version"
          test "$tauri_version" = "$version"
          test "$cargo_version" = "$version"
          test -f "docs/releases/$TAG.md"

      - name: Prepare draft GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          notes="docs/releases/$TAG.md"
          release_id="$(
            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/releases" \
              --raw-field tag_name="$TAG" \
              --raw-field name="Minamo $TAG" \
              --raw-field body="$(<"$notes")" \
              --field draft=true \
              --jq '.id'
          )"
          test -n "$release_id"
          echo "id=$release_id" >> "$GITHUB_OUTPUT"

  desktop:
    name: desktop (${{ matrix.name }})
    needs: prepare
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            platform: ubuntu-22.04
            target: ''
            args: --bundles appimage,deb
          - name: Windows x86_64
            platform: windows-latest
            target: ''
            args: --bundles nsis,msi
          - name: macOS Apple Silicon
            platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg
          - name: macOS Intel
            platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles dmg
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: pnpm/action-setup@v6
        with:
          version: 11.0.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Tauri Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and upload native installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tagName: ${{ needs.prepare.outputs.tag }}
          tauriScript: pnpm exec tauri
          args: ${{ matrix.args }}
          retryAttempts: 1
          uploadUpdaterJson: false
          releaseAssetNamePattern: Minamo-Studio_[version]_[platform]_[arch][setup][ext]

  publish:
    needs:
      - prepare
      - desktop
    runs-on: ubuntu-24.04
    steps:
      - name: Publish the complete GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        run: |
          gh api \
            --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            --field draft=false \
            --raw-field make_latest=true \
            >/dev/null

  cleanup:
    needs:
      - prepare
      - desktop
      - publish
    if: ${{ always() && needs.prepare.result == 'success' && needs.publish.result != 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Remove incomplete draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        run: |
          release_draft="$(
            gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq '.draft'
          )"
          if test "$release_draft" = true; then
            gh api \
              --method DELETE \
              "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"
          else
            echo "release already published; skipping cleanup"
          fi
