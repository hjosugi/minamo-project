name: release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release/v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to publish without moving it
        required: true
        type: string

permissions:
  contents: write

# Both trigger paths must land in the SAME group, or a workflow_dispatch and a
# tag push for one release run concurrently (#355). `github.ref` is
# `refs/tags/v0.1.19` while `inputs.tag` is `v0.1.19`, so the two never compared
# equal and v0.1.19 built its full installer matrix twice, with two draft
# releases open at once. `github.ref_name` is the bare tag on a tag push, which
# is the same value `prepare` resolves.
#
# `cancel-in-progress` stays false on purpose: cancelling a release mid-upload
# leaves a partial set of assets on the draft. The group key is therefore the
# only thing preventing a double publish.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.deleted == false }}
    runs-on: ubuntu-24.04
    outputs:
      release_id: ${{ steps.release.outputs.id }}
      tag: ${{ steps.release_tag.outputs.tag }}
    steps:
      - name: Resolve immutable release tag
        id: release_tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if test -n "$INPUT_TAG"; then
            tag="$INPUT_TAG"
          elif test "$REF_TYPE" = tag; then
            tag="$REF_NAME"
          else
            case "$REF_NAME" in
              release/v*) tag="${REF_NAME#release/}" ;;
              *) echo "unsupported release ref: $REF_NAME" >&2; exit 1 ;;
            esac
          fi
          case "$tag" in
            v*) ;;
            *) echo "release tag must start with v: $tag" >&2; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.release_tag.outputs.tag }}

      - name: Validate release metadata
        env:
          TAG: ${{ steps.release_tag.outputs.tag }}
        run: node scripts/validate-release-metadata.mjs "$TAG"

      - name: Prepare draft GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          notes="docs/releases/$TAG.md"
          # POST /releases happily creates a SECOND release for a tag that
          # already has a draft one, which is how v0.1.19 ended up with two
          # drafts open at once (#355). The concurrency group is the real fix;
          # this is the backstop for the cases it cannot see, such as a draft
          # left behind by an earlier run or a tag that is already published.
          # A failed run's `cleanup` removes its own draft, so an honest retry
          # still finds nothing here.
          existing_tags="$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name'
          )"
          if printf '%s\n' "$existing_tags" | grep -qxF "$TAG"; then
            echo "a GitHub Release already exists for $TAG." >&2
            echo "Delete the existing release (or publish a new tag) before re-running." >&2
            exit 1
          fi
          release_id="$(
            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/releases" \
              --raw-field tag_name="$TAG" \
              --raw-field name="Minamo $TAG" \
              --raw-field body="$(<"$notes")" \
              --field draft=true \
              --jq '.id'
          )"
          test -n "$release_id"
          echo "id=$release_id" >> "$GITHUB_OUTPUT"

  desktop:
    name: desktop (${{ matrix.name }})
    needs: prepare
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      # tauri-action updates one shared latest.json asset per target. Serialize
      # the matrix so each target merges the manifest written by the previous
      # target instead of racing and dropping platform entries.
      max-parallel: 1
      matrix:
        include:
          - name: Linux x86_64
            platform: ubuntu-22.04
            target: ''
            args: --bundles appimage,deb
          - name: Windows x86_64
            platform: windows-latest
            target: ''
            args: --bundles nsis,msi
          - name: macOS Apple Silicon
            platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles app,dmg
          - name: macOS Intel
            platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles app,dmg
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: pnpm/action-setup@v6
        with:
          version: 11.0.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Tauri Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and upload native installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tagName: ${{ needs.prepare.outputs.tag }}
          tauriScript: pnpm exec tauri
          args: ${{ matrix.args }}
          retryAttempts: 1
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          releaseAssetNamePattern: Minamo-Studio_[version]_[platform]_[arch][setup][ext]

  publish:
    needs:
      - prepare
      - desktop
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Validate the complete signed updater manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          asset_ids="$(
            gh api \
              --paginate \
              "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
              --jq '.[] | select(.name == "latest.json") | .id'
          )"
          asset_count="$(printf '%s\n' "$asset_ids" | sed '/^$/d' | wc -l)"
          test "$asset_count" -eq 1
          asset_id="$(printf '%s\n' "$asset_ids" | sed '/^$/d')"
          gh api \
            -H 'Accept: application/octet-stream' \
            "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
            > "$RUNNER_TEMP/latest.json"
          node scripts/validate-updater-manifest.mjs \
            "$RUNNER_TEMP/latest.json" \
            "${TAG#v}"

      - name: Publish the complete GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        run: |
          gh api \
            --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            --field draft=false \
            --raw-field make_latest=true \
            >/dev/null

  cleanup:
    needs:
      - prepare
      - desktop
      - publish
    if: ${{ always() && needs.prepare.result == 'success' && needs.publish.result != 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Remove incomplete draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        run: |
          release_draft="$(
            gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq '.draft'
          )"
          if test "$release_draft" = true; then
            gh api \
              --method DELETE \
              "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"
          else
            echo "release already published; skipping cleanup"
          fi
