name: mediapipe-canary

# Early-warning canary for upcoming @mediapipe/tasks-vision releases (#272,
# PR #358). The tracker depends on both the Face / Hand / Pose API surface and a
# telemetry-free local-only runtime. This scheduled job installs the nightly
# release and checks both contracts without changing the exact production pin.

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:
  # Also run when the canary itself or its watchlist changes.
  push:
    paths:
      - 'scripts/mediapipe-canary-smoke.mjs'
      - 'scripts/mediapipe-privacy-guard.mjs'
      - '.github/workflows/mediapipe-canary.yml'
      - 'docs/mediapipe-1.0-migration.md'
      - 'docs/mediapipe-1.0-migration.ja.md'

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.0.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Canary smoke on the pinned version (sanity)
        run: node scripts/mediapipe-canary-smoke.mjs
      - name: Install the tasks-vision nightly release
        # Pre-release builds ship under the `nightly` dist-tag. -w targets the
        # pnpm workspace root explicitly.
        run: pnpm add -w "@mediapipe/tasks-vision@nightly"
      - name: Canary smoke on the nightly release
        run: node scripts/mediapipe-canary-smoke.mjs
