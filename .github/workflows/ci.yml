name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref so a rapid push does not queue behind
# stale builds (faster feedback, fewer wasted minutes).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.0.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint source and docs
        run: pnpm lint
      - name: Run unit and structure smoke tests
        run: pnpm test
      - name: Coverage gate for the shipped runtime
        run: pnpm coverage
      - name: Privacy invariant (no raw webcam upload)
        run: node scripts/check-privacy-invariants.mjs
      - name: Verify repository structure
        run: pnpm verify
      - name: TypeScript strict gate
        run: pnpm typecheck
      - name: Browser JavaScript type contract gate
        run: pnpm typecheck:js
      - name: Build production bundle
        run: pnpm build

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.0.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install benchmark media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Exercise the synthetic drum benchmark contract and thresholds
        run: pnpm benchmark:drum:ci
      - name: Enforce the headless motion-pipeline throughput floor
        run: pnpm benchmark:pipeline

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Cache the crate registry + build outputs so wtransport/quinn are not
      # recompiled from scratch every run.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            relay-rs
            crates/kgm1-codec/fuzz
      - run: cargo fmt --manifest-path relay-rs/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path relay-rs/Cargo.toml --all-targets -- -D warnings
      - run: cargo build --locked --manifest-path relay-rs/Cargo.toml --release
      - run: cargo test --locked --manifest-path relay-rs/Cargo.toml
      - run: cargo fmt --manifest-path crates/kgm1-codec/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path crates/kgm1-codec/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path crates/kgm1-codec/Cargo.toml
      # The fuzz harness only needs nightly to *run* under a sanitizer; checking
      # and formatting it works on stable, so it is gated here rather than
      # pinning those to a moving nightly rustfmt (#262).
      - run: cargo fmt --manifest-path crates/kgm1-codec/fuzz/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path crates/kgm1-codec/fuzz/Cargo.toml --all-targets -- -D warnings

  # Short smoke budget so a regression in the container decoder is caught on the
  # PR that introduces it; the real search happens weekly in fuzz.yml (#262).
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # cargo-fuzz needs the sanitizer support that only nightly ships.
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/kgm1-codec/fuzz
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2.85.3
        with:
          tool: cargo-fuzz
      - name: Seed the corpus from the shared conformance vectors
        run: node scripts/seed-fuzz-corpus.mjs
      # --target is explicit because cargo-fuzz infers the host triple from how
      # its own binary was built, and the prebuilt one is musl-linked; left to
      # itself it tries to build for a musl std the runner does not have.
      - name: Fuzz the KGM1B container decoder
        run: |
          for target in decode_packet corrupt_valid roundtrip; do
            cargo +nightly fuzz run --fuzz-dir crates/kgm1-codec/fuzz \
              --target x86_64-unknown-linux-gnu "$target" -- \
              -max_total_time=30 -print_final_stats=1
          done
      - name: Upload the failing input
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts-ci
          path: crates/kgm1-codec/fuzz/artifacts
          if-no-files-found: ignore

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.0.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # The Tauri dep tree is the slowest compile in CI; cache it across runs.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build desktop frontend assets
        run: pnpm build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      # The full release bundle is the slowest step; PRs, feature branches, and
      # tags get cargo check/clippy/test above. Main proves the Linux package,
      # while release.yml owns and signs the cross-platform updater bundles.
      - name: Build the desktop bundle (deb)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pnpm exec tauri build --bundles deb --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Upload the desktop bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: minamo-studio-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  relay-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.0.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --check server.mjs
        working-directory: relay-node
      - run: pnpm test
        working-directory: relay-node

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.0.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit npm production dependencies
        run: pnpm audit --prod --audit-level high
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2.85.3
        with:
          tool: cargo-audit
      - name: Audit Rust advisories
        run: |
          cargo audit --file Cargo.lock
          cargo audit --file relay-rs/Cargo.lock
          cargo audit --file src-tauri/Cargo.lock

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Build (do not push) both shipped images so Dockerfile regressions surface
      # in CI, not on a deploy (#261).
      - name: Build the relay-node image
        run: docker build -f Dockerfile.relay-node -t minamo-relay-node:ci .
      - name: Build the relay-rs image
        run: docker build -t minamo-relay-rs:ci ./relay-rs
