name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint source and docs
        run: pnpm lint
      - name: Run unit and structure smoke tests
        run: pnpm test
      - name: Verify repository structure
        run: pnpm verify
      - name: TypeScript strict gate
        run: pnpm typecheck
      - name: Browser JavaScript type contract gate
        run: pnpm typecheck:js
      - name: Build production bundle
        run: pnpm build

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path relay-rs/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path relay-rs/Cargo.toml --all-targets -- -D warnings
      - run: cargo build --locked --manifest-path relay-rs/Cargo.toml --release
      - run: cargo test --locked --manifest-path relay-rs/Cargo.toml
      - run: cargo fmt --manifest-path crates/kgm1-codec/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path crates/kgm1-codec/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path crates/kgm1-codec/Cargo.toml

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build desktop frontend assets
        run: pnpm build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build the desktop bundle (deb)
        run: pnpm exec tauri build --bundles deb
      - name: Upload the desktop bundle
        uses: actions/upload-artifact@v4
        with:
          name: minamo-studio-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  relay-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --check server.mjs
        working-directory: relay-node
      - run: pnpm test
        working-directory: relay-node

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit npm production dependencies
        run: pnpm audit --prod --audit-level high
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit Rust advisories
        run: |
          cargo audit --file Cargo.lock
          cargo audit --file relay-rs/Cargo.lock
          cargo audit --file src-tauri/Cargo.lock

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Build (do not push) both shipped images so Dockerfile regressions surface
      # in CI, not on a deploy (#261).
      - name: Build the relay-node image
        run: docker build -f Dockerfile.relay-node -t minamo-relay-node:ci .
      - name: Build the relay-rs image
        run: docker build -t minamo-relay-rs:ci ./relay-rs
