name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref so a rapid push does not queue behind
# stale builds (faster feedback, fewer wasted minutes).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.0.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint source and docs
        run: pnpm lint
      - name: Run unit and structure smoke tests
        run: pnpm test
      - name: Coverage gate for the shipped runtime
        run: pnpm coverage
      - name: Privacy invariant (no raw webcam upload)
        run: node scripts/check-privacy-invariants.mjs
      - name: Verify repository structure
        run: pnpm verify
      - name: TypeScript strict gate
        run: pnpm typecheck
      - name: Browser JavaScript type contract gate
        run: pnpm typecheck:js
      - name: Build production bundle
        run: pnpm build

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.0.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Exercise the synthetic drum benchmark contract and thresholds
        run: pnpm benchmark:drum:ci
      - name: Enforce the headless motion-pipeline throughput floor
        run: pnpm benchmark:pipeline

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Cache the crate registry + build outputs so wtransport/quinn are not
      # recompiled from scratch every run.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            relay-rs
      - run: cargo fmt --manifest-path relay-rs/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path relay-rs/Cargo.toml --all-targets -- -D warnings
      - run: cargo build --locked --manifest-path relay-rs/Cargo.toml --release
      - run: cargo test --locked --manifest-path relay-rs/Cargo.toml
      - run: cargo fmt --manifest-path crates/kgm1-codec/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path crates/kgm1-codec/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path crates/kgm1-codec/Cargo.toml

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.0.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # The Tauri dep tree is the slowest compile in CI; cache it across runs.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build desktop frontend assets
        run: pnpm build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      # The full release bundle is the slowest step; PRs and feature branches get
      # cargo check/clippy/test above, and the bundle is built on main and tags.
      - name: Build the desktop bundle (deb)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        run: pnpm exec tauri build --bundles deb
      - name: Upload the desktop bundle
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: actions/upload-artifact@v7
        with:
          name: minamo-studio-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  relay-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.0.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --check server.mjs
        working-directory: relay-node
      - run: pnpm test
        working-directory: relay-node

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.0.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit npm production dependencies
        run: pnpm audit --prod --audit-level high
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit Rust advisories
        run: |
          cargo audit --file Cargo.lock
          cargo audit --file relay-rs/Cargo.lock
          cargo audit --file src-tauri/Cargo.lock

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Build (do not push) both shipped images so Dockerfile regressions surface
      # in CI, not on a deploy (#261).
      - name: Build the relay-node image
        run: docker build -f Dockerfile.relay-node -t minamo-relay-node:ci .
      - name: Build the relay-rs image
        run: docker build -t minamo-relay-rs:ci ./relay-rs
